name: Block sensitive docs

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  block-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if docs/ is committed
        shell: bash
        run: |
          if git ls-files --error-unmatch 'docs/**' >/dev/null 2>&1; then
            echo "ERROR: docs/ is tracked in this repository."
            echo "Move docs to a separate private repo and keep docs/ ignored."
            exit 1
          fi

