name: CI

on:
  push:
    branches:
      - main
      - DevBySalem
      - DevByBashar
      - DevByFaisal
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: bcmath, mbstring, dom, curl, intl, gd, zip, sqlite3, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link || true
          chmod -R ug+rwx storage bootstrap/cache || true

      - name: Run tests
        run: composer test

  katalon-tests:
    runs-on: ubuntu-latest
    needs: php-tests

    steps:
      - name: Checkout Katalon tests
        uses: actions/checkout@v4
        with:
          repository: MrPrUNKNOWN/nubl-testing-automation
          token: ${{ secrets.GH_PAT }}

      - name: Wait for Forge to finish deploying
        run: sleep 60

      - name: Install virtual display
        run: sudo apt-get install -y xvfb

      - name: Start virtual display
        run: Xvfb :99 -screen 0 1920x1080x24 &

      - name: Run Katalon Tests against nublhope.com
        uses: katalon-studio/katalon-studio-github-action@v3
        with:
          version: '11.1.2'
          projectPath: '${{ github.workspace }}'
          args: >-
            -retry=0
            -testSuiteCollectionPath="Test Suites/All"
            -executionProfile="default"
            -browserType="Chrome"
        env:
          KATALON_API_KEY: ${{ secrets.KATALON_API_KEY }}
          DISPLAY: :99
