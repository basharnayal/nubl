# ─────────────────────────────────────────────────────────────────────────────
# NUBL — Docker Compose (development)
#
# Quick start:
#   docker compose up -d --build
#   → App:   http://localhost:8000
#   → Vite:  http://localhost:5173  (when using `docker compose up vite`)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Laravel application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nubl-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - app-vendor:/var/www/html/vendor
      - app-node-modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nubl
      DB_USERNAME: nubl
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    networks:
      - nubl

  # ── Queue worker ─────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nubl-queue
    restart: unless-stopped
    entrypoint: queue-entrypoint.sh
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
      - app-vendor:/var/www/html/vendor
      - app-node-modules:/var/www/html/node_modules
    depends_on:
      - app
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nubl
      DB_USERNAME: nubl
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    networks:
      - nubl

  # ── Vite dev server (optional — run with: docker compose up vite) ──────
  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nubl-vite
    restart: "no"
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - app-node-modules:/var/www/html/node_modules
    profiles:
      - dev
    networks:
      - nubl

  # ── MySQL 8 ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: nubl-mysql
    restart: unless-stopped
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nubl
      MYSQL_USER: nubl
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nubl

  # ── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nubl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nubl

volumes:
  mysql-data:
  redis-data:
  app-vendor:
  app-node-modules:

networks:
  nubl:
    driver: bridge
